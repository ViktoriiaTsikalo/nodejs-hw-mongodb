openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description:
    A simple Contacts API that allows users to manage their personal and professional contacts. 
    Users can create, update, delete, and search contacts, mark them as favorites, and upload a photo.
    Authorization is required for all operations.
tags:
   - name: Contacts
     description: Operations about contacts.
   - name: Auth
     description: Auth operations.
servers:
  - url: https://contacts-app-accv.onrender.com
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{id}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch: 
      $ref: ../swagger/paths/contacts/{id}/patch.yaml 
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
